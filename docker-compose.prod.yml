# 佛光山幹部改選投票系統 — 正式對外（HTTPS）部署
#
# 用途：需要讓「不在同一個 Wi-Fi」的會員也能投票時使用。
#       對外只開 80 / 443，由 Caddy 自動申請並續期 Let's Encrypt 憑證；
#       web / api / db / redis 全部只在內部網路，不會直接暴露。
#
# 使用方式（在專案根目錄）：
#   cp deploy/.env.example .env      # 填好密碼 + 三個網域變數
#   vi deploy/Caddyfile              # 確認網域（也可只用 .env 變數）
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 前置條件：
#   1. 已有一個網域，DNS A 記錄指向這台主機的對外 IP
#   2. 主機的 80 / 443 沒有被其他服務佔用、且防火牆有開
#
# 與 LAN 版（docker-compose.yml）的差異：
#   - web 不再對外開 8080 / 8081，改由 caddy 反向代理
#   - 多一個 caddy 服務（自動 HTTPS）
version: "3.8"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fgs_vote}
      POSTGRES_USER: ${POSTGRES_USER:-fgs_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Toronto}
    volumes:
      # ⚠️ PostgreSQL 18 起，資料目錄掛載點是 /var/lib/postgresql（不是 .../data）
      - pgdata:/var/lib/postgresql
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fgs_app} -d ${POSTGRES_DB:-fgs_vote}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [fgs]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?請在 .env 設定 REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [fgs]

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      # ⚠️ 後端 app/config.py 讀的是個別欄位（db_host/db_user/…），不是 DATABASE_URL
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-fgs_vote}
      DB_USER: ${DB_USER:-fgs_app}
      DB_PASSWORD: ${DB_PASSWORD:?請在 .env 設定 DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?請在 .env 設定 REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?請在 .env 設定 JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      VOTER_TOKEN_EXPIRE_HOURS: ${VOTER_TOKEN_EXPIRE_HOURS:-12}
      API_PREFIX: /api
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Toronto}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        "until python -c \"import os,psycopg2;psycopg2.connect(dbname=os.environ['DB_NAME'],user=os.environ['DB_USER'],password=os.environ['DB_PASSWORD'],host=os.environ['DB_HOST'],port=os.environ.get('DB_PORT','5432')).close()\" 2>/dev/null; do echo '等待 PostgreSQL…'; sleep 2; done; alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'",
      ]
    networks: [fgs]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
      - "81"
    depends_on:
      - api
    environment:
      TZ: ${TZ:-America/Toronto}
    networks: [fgs]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      VOTER_DOMAIN: ${VOTER_DOMAIN:?請在 .env 設定 VOTER_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?請在 .env 設定 ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?請在 .env 設定 ACME_EMAIL}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data # 憑證存放處，務必保留
      - caddyconfig:/config
    depends_on:
      - web
    networks: [fgs]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  fgs:
    driver: bridge
