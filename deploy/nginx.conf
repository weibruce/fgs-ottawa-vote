# 佛光山幹部改選投票系統 — nginx 設定
#
#   :80 → 投票端（手機掃 QR 進來的那個）
#   :81 → 管理後台
# 兩者都把 /api 反向代理到 api 容器，因此前端與 API 同源（無 CORS 問題）。

# ── 投票端 ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/voter;
    index index.html;

    # 用變數 + Docker 內建 DNS 做「執行期解析」：
    # upstream 若寫死主機名，api 容器還沒起來時 nginx 會直接啟動失敗
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fgs_api http://api:8000;

    client_max_body_size 32m;   # 會員名單 Excel 匯入用

    location /api/ {
        proxy_pass $fgs_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 靜態資源（含雜湊檔名）：長快取
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ico|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其餘一律回 index.html（SPA 前端路由）
    #
    # ⚠️ 這裡刻意「不用」`try_files $uri $uri/ /index.html`：
    #    靜態目錄（例如 /candidates 放候選人照片）會與前端的 SPA 路由同名
    #    （後台也有 /candidates 這一頁），nginx 會先匹配到目錄而回 301 轉向，
    #    導致該頁打不開。用下面的寫法就不會去做目錄匹配。
    location / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
}

# ── 管理後台 ──────────────────────────────────────────────────────
server {
    listen 81;
    server_name _;
    root /usr/share/nginx/admin;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fgs_api http://api:8000;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass $fgs_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 匯出 Excel / 計票可能較久
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ico|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
}
